# Response headers for documents and static assets.
#
# In its own file because nginx's add_header does not merge: an add_header in a
# location REPLACES every add_header inherited from the server block rather
# than adding to it. So each location that needs these has to state them, and
# stating them once here is the only way they stay in step.
#
# These belong on the nginx side, not the API side. A browser enforces CSP,
# framing and referrer policy against the DOCUMENT - and the document is served
# from disk by nginx, which never reaches Express. Before this, the SPA shipped
# with no CSP, no HSTS and no frame protection at all, while helmet's full set
# went only to the JSON responses nobody renders.

# One year, subdomains included, and deliberately NO preload. Preload is a
# one-way door: it is compiled into browsers and removal takes months, so it is
# a considered decision for later, not a default.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy, built from what this bundle actually loads rather
# than from a template:
#
#   style-src   'unsafe-inline'       Tailwind and Recharts both set inline
#               + fonts.googleapis    styles; index.html pulls a Google Fonts
#                                     stylesheet
#   font-src    + fonts.gstatic       the font files themselves. There are no
#                                     self-hosted font files in the build, so
#                                     dropping these two hosts changes every
#                                     typeface in the product
#   img-src     + data: blob:         barcodes, QR codes and receipt previews
#                                     are drawn on a canvas and read back out
#   connect-src + localhost ws/wss    QZ TRAY. Thermal printing is a WebSocket
#                                     from the browser to QZ Tray on the till
#                                     itself. Omit this and receipts stop
#                                     printing - and because the connection
#                                     never leaves the machine, no proxy or
#                                     edge setting can compensate
#   frame-ancestors 'none'            a point of sale has no business being
#                                     framed by anything
#
# To run it in report-only mode during a cutover, comment the first line and
# uncomment the second, then redeploy.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://localhost:* ws://localhost:* https://localhost:*; worker-src 'self' blob:; manifest-src 'self'" always;
# add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss://localhost:* ws://localhost:* https://localhost:*; worker-src 'self' blob:; manifest-src 'self'" always;
