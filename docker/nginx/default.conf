# The single origin.
#
# The SPA asks for a relative `/api`, so the app and the API must answer on one
# host; this is what makes that true. It also means no CORS is involved in a
# Compose run, exactly as in production.
#
# TLS is deliberately absent - Phase 9 owns certificates and Cloudflare.

server {
  listen 80;
  server_name _;

  # WHY A RESOLVER AND A VARIABLE, AND NOT AN `upstream` BLOCK.
  #
  # nginx resolves a hostname written literally in `proxy_pass` - or in an
  # `upstream` server - exactly once, when it loads its configuration, and then
  # caches the address for ever. In Compose that is a trap: recreating the API
  # container gives it a new address, and nginx keeps proxying to the old one,
  # answering 502 to everything until nginx itself is restarted. It was found
  # that way, by recreating the API and watching every request fail.
  #
  # A hostname held in a VARIABLE is resolved per request instead, through the
  # resolver below - 127.0.0.11 is Docker's own embedded DNS. `valid=10s` keeps
  # it from asking for every single request. The cost is `upstream` keepalive,
  # which at this scale is not worth a stack that breaks on redeploy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $api_host api:4000;

  # Uploaded images are the largest thing a cashier sends; the API's own cap is
  # 20 MB, so refusing earlier here would only produce a worse error.
  client_max_body_size 25m;

  # Nothing about the server's identity is a client's business.
  server_tokens off;

  # ---------------------------------------------------------------- the API
  location /api/ {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;

    # `TRUST_PROXY_HOPS=1` tells Express to take the client address from the
    # RIGHTMOST entry of X-Forwarded-For that it did not add itself. Appending
    # rather than replacing is what keeps that true, and the client IP is what
    # almost every rate limiter counts against - so this is a security setting,
    # not a convenience.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $host;

    # The refresh token is an httpOnly cookie; it has to survive the hop.
    proxy_pass_request_headers on;

    # A sale must not be abandoned because a slow gateway took a moment, and a
    # 200,000-row export streams for a while.
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Exports stream; buffering them would hold the whole file in nginx first.
    proxy_buffering off;
  }

  # ------------------------------------------------------- uploaded files
  # Proxied to the API rather than served from the volume directly. The API
  # owns the ownership registry that decides a file belongs to the workspace
  # asking for it, and nginx has no way to know that. Serving the volume
  # directly would be faster and is a Phase 8/9 question, not a Phase 7 one.
  location /uploads/ {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ------------------------------------------------------------------ the SPA
  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints these, so the bytes at a given URL never change.
  location /assets/ {
    # One header, not two: `expires` emits its own Cache-Control, and a CDN
    # reading two of them is a question nobody should have to answer.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else is a client-side route. `index.html` must NEVER be cached:
  # it is the file that names the current asset bundle, so a stale copy points
  # a browser at JavaScript that has been deleted.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, must-revalidate";
  }

  # nginx's own liveness, answered without touching the SPA or the API.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
